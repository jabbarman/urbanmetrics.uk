project: urbanmetrics.uk
phase: source-refresh-maintenance
status: in_progress
summary: >-
  The live v1 platform is deployed and tagged at v0.1.1. The next delivery stage is Phase 1 health and workforce
  expansion. Official Phase 1 source files have been confirmed, adapter-aware ingestion groundwork is implemented,
  SubICB reference geometry is generated locally, and the first Talking Therapies SubICB slice now builds successfully
  with two current health layers plus a Midlands annual therapy-type companion panel. User feedback on the mixed
  homepage workspace has now been translated into an implemented route split: `/` is an overview page, and
  `/regional-context` plus `/health-access` now provide separate map workspaces with filtered catalogs, route-specific
  defaults, and shared status/navigation. In parallel, the sync path has been hardened against partial upstream source
  periods so CI can fall back to the latest complete publication while the monitor path continues to surface the
  incomplete latest release. Follow-up live verification identified a legend layout issue at standard desktop widths;
  that has now been corrected and bundled with a documentation and versioning refresh for the `v0.2.0` release. A
  post-release investigation then distinguished real upstream degradation from freshness-policy mismatch: workspace
  headers are now scoped to their own layer subsets, Talking Therapies monthly layers now allow for publication lag,
  and structurally lagged annual context layers are tracked for visibility rather than driving degraded status. On
  June 2, 2026, upstream checks found newer complete Universal Credit in-work data in BCO and newer NHS Talking
  Therapies monthly data, so generated artifacts were refreshed to UC `2026-02` and Talking Therapies `2026-03-31`.
  The July 21, 2026 refresh advances Talking Therapies to `2026-05-31`, discovers future latest NHS publications
  automatically, moves reference geometry to April 2026 Sub ICB boundaries, and isolates layer refresh failures so
  incompatible UC, fuel-poverty, and GVA ward feeds retain their last complete artifacts with visible status warnings.
last_updated: 2026-07-21
current_focus:
  - validate the July 2026 NHS and Sub ICB generated-artifact refresh in the live environment after deployment
  - keep the shared generated-data and status architecture intact while the presentation layer evolves
  - monitor for compatible May 2026 WMCA ward geometry before migrating UC, fuel poverty, and GVA
  - keep CI and refresh behavior resilient when upstreams publish incomplete or delayed latest periods
next_executable_step: verify the May 2026 Talking Therapies source period and April 2026 Sub ICB geography in production
blockers:
  - current BCO UC, fuel-poverty, and GVA rows use changed May 2026 ward codes without geometry, and compatible ONS May 2026 ward boundaries were not yet available during the refresh
risks:
  - some desired workforce datasets may only be usable at provider/trust geography, which is not suitable for a resident-area choropleth without extra methodology
  - supporting multiple geography groups increases UI and validation complexity and must not enable misleading comparisons
  - the route split improves information architecture, but copy and navigation may still need a follow-on polish pass once users interact with the live routes
  - freshness policy remains partly judgment-based for lagged official statistics, so thresholds will need occasional review against real publication timetables
  - NHS latest-publication discovery depends on publisher page markup and must remain covered by monitoring and negative-path tests
  - ward-based layers cannot move to newer values until all changed ward codes have compatible validated geometry
