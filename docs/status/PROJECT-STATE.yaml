project: urbanmetrics.uk
phase: phase-1-health-workforce-planning
status: in_progress
summary: >-
  The live v1 platform is deployed and tagged at v0.1.1. The next delivery stage is Phase 1 health and workforce
  expansion, with planning now focused on introducing official health/service data through a non-BCO adapter path
  and a new ICB-level geography flow.
last_updated: 2026-03-15
current_focus:
  - confirm exact publication files for NHS Talking Therapies and Mental Health Services Monthly Statistics
  - define the source-adapter abstraction for CSV/download-based official datasets
  - prepare ICB geometry and compare-group support without destabilizing the live ward-based stack
next_executable_step: confirm the first Phase 1 source files and geography keys, then implement the adapter contract and ICB geometry groundwork
blockers:
  - final Phase 1 indicator choice depends on exact publication-level geography fields in the selected NHS datasets
risks:
  - some desired workforce datasets may only be usable at provider/trust geography, which is not suitable for a resident-area choropleth without extra methodology
  - supporting multiple geography groups increases UI and validation complexity and must not enable misleading comparisons
